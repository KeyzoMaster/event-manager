<div class="container mx-auto px-4 mt-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Event Calendar</h2>
    <div class="flex">
      <button class="border border-gray-300 text-gray-700 px-4 py-2 rounded mr-2 hover:bg-gray-100 focus:outline-none" (click)="refreshCalendar()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      @if(isAdmin){
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 focus:outline-none">
          <i class="bi bi-plus-circle"></i> Add Event
        </button>
      }
    </div>
  </div>
  @if(isLoading){
    <div class="text-center my-5">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-blue-600" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
  }@else{
    <div class="bg-white rounded-lg shadow">
      <div class="p-4">
        <div class="flex flex-wrap mb-3">
          <span class="mr-3"><i class="bi bi-square-fill text-blue-600"></i> Workshop</span>
          <span class="mr-3"><i class="bi bi-square-fill text-red-600"></i> Conference</span>
          <span class="mr-3"><i class="bi bi-square-fill text-yellow-500"></i> Meeting</span>
          <span class="mr-3"><i class="bi bi-square-fill text-green-600"></i> Social</span>
          <span><i class="bi bi-square-fill text-gray-500"></i> Other</span>
        </div>
        <full-calendar [options]="calendarOptions"></full-calendar>
      </div>
    </div>
  }
  @if(errorMessage){
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mt-4">
      {{ errorMessage }}
    </div>
  }
</div>
