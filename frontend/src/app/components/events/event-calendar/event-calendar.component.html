<!-- event-calendar.component.html -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Event Calendar</h2>
      <div class="d-flex">
        <button class="btn btn-outline-secondary me-2" (click)="refreshCalendar()">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
        @if(isAdmin){
          <button class="btn btn-primary" routerLink="/events/create">
            <i class="bi bi-plus-circle"></i> Add Event
          </button>
        }
       
      </div>
    </div>
    @if(isLoading){
      <div class="text-center my-5">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    }@else{
      <div class="card">
        <div class="card-body">
          <div class="fc-event-legend mb-3">
            <span class="me-3"><i class="bi bi-square-fill text-primary"></i> Workshop</span>
            <span class="me-3"><i class="bi bi-square-fill text-danger"></i> Conference</span>
            <span class="me-3"><i class="bi bi-square-fill text-warning"></i> Meeting</span>
            <span class="me-3"><i class="bi bi-square-fill text-success"></i> Social</span>
            <span><i class="bi bi-square-fill text-secondary"></i> Other</span>
          </div>
          <full-calendar [options]="calendarOptions"></full-calendar>
        </div>
      </div>
    }
    @if(errorMessage){
      <div class="alert alert-danger">
        {{ errorMessage }}
      </div>
    }
  
    
  
    
  </div>
